<html>
  <head>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@latest?dev",
          "react-dom/client": "https://esm.sh/react-dom@latest/client?dev",
          "react/jsx-runtime": "https://esm.sh/react@latest/jsx-runtime?dev"
        }
      }
    </script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone@latest/babel.min.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="text/babel" data-type="module" data-presets="react">
      import React from 'react';
      import { createRoot } from 'react-dom/client';

      // Componente precisa comecar com letra MAIUSCULA
      // Desestruturando o objeto props direto no parametro
      function Header({ title }) {
        // Chaves {} abrem o "modo JavaScript" dentro do JSX
        // Template literal: junta texto fixo com a variavel
        return <h1>{`Cool ${title}`}</h1>;
      }

      function HomePage() {
        return (
          <div>
            {/* Passando a prop title para o Header */}
            <Header title="React" />
          </div>
        );
      }

      const domNode = document.getElementById('app');
      const root = createRoot(domNode);
      // HomePage e o componente de nivel mais alto da arvore
      root.render(<HomePage />);
    </script>
  </body>
</html>
